name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Pure-logic tests: no API key, no network, no dependencies beyond the
  # standard library. Unlike the UI suite below these run on every push and
  # every fork's PRs, so they're the gate that actually protects the branch.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the unit suite
        run: python -m unittest discover -s tests -t . -v

  ui-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The suite drives the real Gemini API; without the secret we skip
      # gracefully instead of failing every fork/PR.
      #
      # GEMINI_API_KEY_CI, not GEMINI_API_KEY: one run fires ~20 chat calls
      # plus TTS, embeddings and distillation, and a day of re-running this
      # has already spent a free tier's daily quota — which, while the live
      # site was served by the same key, meant the site answered real visitors
      # with nothing until the reset. Testing must not be able to take
      # production down. The key belongs to a *separate Google Cloud project*
      # as well as being a separate key: free-tier quota is counted per
      # project, so two keys in one project share the limit and split nothing.
      - name: Check for API key
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY_CI }}" ]; then
            echo "GEMINI_API_KEY_CI secret not set — skipping the UI suite."
            echo "See docs/DEPLOY.md: it must be a key from its own project,"
            echo "never the one the live site runs on."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Install server dependencies
        if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22

      - name: Install Playwright
        if: env.SKIP != '1'
        run: |
          npm init -y > /dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start the platform
        if: env.SKIP != '1'
        env:
          # the app still reads GEMINI_API_KEY — only where CI gets it changes
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
          # The suite fires ~20 real chat calls with none of the pacing a
          # human conversation has, easily exceeding the 8/min default
          # meant to protect the shared API key from real visitors — that
          # throttle then replaces expected replies with an in-character
          # "give me a sec" message, failing unrelated checks downstream.
          PLATFORM_RATE_PER_MIN: "60"
          # Set so the suite can exercise both sides of the stats lock: an
          # unset token closes the endpoint, which would leave the served
          # path untested.
          PLATFORM_STATS_TOKEN: "ci-stats-token"
        run: |
          uvicorn app:app --port 8765 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8765/ && break
            sleep 1
          done

      - name: Run the UI suite
        if: env.SKIP != '1'
        env:
          # must match the value the server above was started with
          PLATFORM_STATS_TOKEN: "ci-stats-token"
        run: node tests/ui_test.js
