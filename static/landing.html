<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/png" href="/static/icons/lissa-192.png">
<title>{{site}}</title>
<script>
  // theme before paint, shared with the chat pages
  (function () {
    try {
      var t = localStorage.getItem("ld_theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches)
          ? "light" : "dark";
      }
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg0: #080a0f;
    --bg1: #121722;
    --text: #eef1f6;
    --muted: #97a1b3;
    --card: rgba(255, 255, 255, 0.04);
    --card-hover: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.1);
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --bg0: #f4f6fa;
    --bg1: #ffffff;
    --text: #141822;
    --muted: #5d6779;
    --card: rgba(20, 24, 34, 0.035);
    --card-hover: rgba(20, 24, 34, 0.06);
    --border: rgba(20, 24, 34, 0.12);
    --shadow: 0 18px 40px rgba(20, 24, 34, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    background: radial-gradient(120% 90% at 20% 0%, var(--bg1), var(--bg0) 70%);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 0 20px;
  }
  main { width: 100%; max-width: 620px; padding: 64px 0 80px; }
  header { margin-bottom: 40px; }
  h1 {
    font-size: 30px;
    font-weight: 660;
    letter-spacing: -0.4px;
    margin-bottom: 8px;
  }
  .lede { color: var(--muted); font-size: 15.5px; line-height: 1.55; max-width: 46ch; }

  .bots { display: flex; flex-direction: column; gap: 14px; }
  .bot {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: background 0.16s, transform 0.12s, border-color 0.16s;
  }
  .bot:hover {
    background: var(--card-hover);
    border-color: rgb(var(--accent-rgb) / 0.5);
    transform: translateY(-2px);
  }
  .bot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .mark {
    width: 62px; height: 62px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 4px 18px rgb(var(--accent-rgb) / 0.3);
  }
  .mark svg { width: 100%; height: 100%; display: block; }
  .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .meta b { font-size: 17px; font-weight: 640; }
  .meta span { font-size: 14px; color: var(--muted); line-height: 1.45; }

  footer {
    margin-top: 44px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }
  footer a { color: inherit; }
  @media (max-width: 480px) {
    main { padding-top: 44px; }
    h1 { font-size: 25px; }
    .mark { width: 52px; height: 52px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{site}}</h1>
    <p class="lede">
      A few chatbots, each with its own job. They remember you between visits —
      in your browser, not on a server — and you can talk to them out loud.
    </p>
  </header>

  <div class="bots">
{{cards}}
  </div>

  <footer>
    Every conversation is private to your browser and forgotten by the server
    after a few hours. <a href="/privacy">How that works</a>.
  </footer>
</main>
</body>
</html>
